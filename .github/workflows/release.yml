name: 构建并发布 Windows 凭据助手

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 发布说明（支持 Markdown）
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-helper-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Windows x64 程序
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 读取版本与发布参数
        id: meta
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $taskSource = Get-Content -LiteralPath VERSION -Raw
          $taskVersion = $taskSource.Trim()
          if ($taskVersion -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw '项目版本无效，应为 v1.0.0 格式。' }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { throw '请填写发布说明。' }
          "version=$taskVersion" >> $env:GITHUB_OUTPUT
          "tag=$taskVersion" >> $env:GITHUB_OUTPUT
          "file_name=LynkSignTokenHelper-windows-x64" >> $env:GITHUB_OUTPUT

      - name: 配置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 检查抓包内核
        run: |
          go test -timeout 90s ./...
          if ($LASTEXITCODE -ne 0) { throw '抓包内核测试失败。' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw '抓包内核静态检查失败。' }

      - name: 构建原生 WPF 程序
        env:
          DEFAULT_SERVER: ${{ vars.WINDOWS_HELPER_DEFAULT_SERVER }}
        run: ./build.ps1 -DefaultServer $env:DEFAULT_SERVER

      - name: 打包固定名称的发布文件
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $taskDist = Join-Path $PWD 'dist'
          $taskSource = Join-Path $taskDist 'LynkSignTokenHelper-windows-x64.exe'
          $taskExpectedVersion = $env:RELEASE_VERSION.TrimStart('v') + '.0'
          if ((Get-Item -LiteralPath $taskSource).VersionInfo.FileVersion -ne $taskExpectedVersion) {
            throw 'EXE 文件版本与发布版本不一致。'
          }
          $taskRelease = Join-Path $taskDist 'release'
          New-Item -ItemType Directory -Path $taskRelease -Force | Out-Null
          $taskExe = Join-Path $taskRelease ($env:FILE_NAME + '.exe')
          $taskZip = Join-Path $taskRelease ($env:FILE_NAME + '.zip')
          Copy-Item -LiteralPath $taskSource -Destination $taskExe -Force
          Compress-Archive -LiteralPath $taskExe,(Join-Path $taskDist 'README.md'),(Join-Path $taskDist 'licenses') -DestinationPath $taskZip -Force
          [IO.File]::WriteAllText((Join-Path $taskRelease 'RELEASE_NOTES.md'), $env:RELEASE_NOTES, [Text.UTF8Encoding]::new($false))

      - name: 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-helper-${{ steps.meta.outputs.version }}
          path: |
            dist/release/${{ steps.meta.outputs.file_name }}.exe
            dist/release/${{ steps.meta.outputs.file_name }}.zip
            dist/release/RELEASE_NOTES.md
          if-no-files-found: error

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $taskRelease = Join-Path $PWD 'dist/release'
          $taskArguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "领克凭据助手 $env:RELEASE_VERSION",
            '--notes-file', (Join-Path $taskRelease 'RELEASE_NOTES.md')
          )
          if ($env:PRERELEASE -eq 'true') { $taskArguments += @('--prerelease','--latest=false') }
          else { $taskArguments += '--latest' }
          $taskArguments += (Join-Path $taskRelease ($env:FILE_NAME + '.exe'))
          $taskArguments += (Join-Path $taskRelease ($env:FILE_NAME + '.zip'))
          gh @taskArguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败，请检查运行日志；已有同名版本不会被覆盖。' }
